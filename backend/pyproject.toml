[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "udyam-digital-backend"
version = "0.1.0"
description = "Udyam Digital — SMB advisor, quote, Smart KYC and tracker API"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "tzdata>=2024.1",            # zoneinfo data on Windows / slim images
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "httpx>=0.27,<1",            # FastAPI TestClient
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "pip-audit>=2.7,<3",
    "pre-commit>=3.8,<5",
]

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "RUF", "C4", "PT", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # assert is the point of tests

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = [
    "error",
    # Starlette >=1.10 prefers `httpx2` for TestClient; plain httpx still works. Revisit later.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
