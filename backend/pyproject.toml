[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "udyam-digital-backend"
version = "0.1.0"
description = "Udyam Digital — SMB advisor, quote, Smart KYC and tracker API"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "pyyaml>=6.0.2,<7",          # pricing_policy.yaml (safe_load only)
    "sqlalchemy>=2.0.36,<3",     # SQLite for the demo; Postgres is a DSN change
    "tzdata>=2024.1",            # zoneinfo data on Windows / slim images
    # Smart KYC (Phase 4)
    "pillow>=12.1,<14",          # decode + re-encode uploads (EXIF strip), image ops
    "numpy>=2.1,<3",             # blur / skew / glyph segmentation (no OpenCV needed)
    "pypdfium2>=4.30,<6",        # server-side PDF rasterisation (drops embedded JS)
    "cryptography>=44,<51",      # AES-256-GCM sealing of KYC blobs and extractions
    # Advisor (Phase 5)
    "httpx>=0.27,<1",            # Groq chat-completions client (timeouts, retries)
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=6,<8",
    "hypothesis>=6.100,<7",      # property tests (pricing)
    "types-pyyaml>=6.0.12,<7",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "pip-audit>=2.7,<3",
    "pre-commit>=3.8,<5",
]

[tool.setuptools.package-data]
"app.domain" = ["*.yaml"]
"app.advisor" = ["prompts/*.txt", "templates/*.json"]

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "RUF", "C4", "PT", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]   # asserts; opaque principal tokens are not passwords

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "tests"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "scripts", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = [
    "error",
    # Starlette >=1.10 prefers `httpx2` for TestClient; plain httpx still works. Revisit later.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
