version: 2
updates:
  # pyproject ranges + pip-compile lock files (backend/requirements*.lock)
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python-dev-tools:
        patterns: ["pytest*", "ruff", "mypy", "pip-audit", "pre-commit", "httpx"]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: ["/backend", "/frontend"]
    schedule: { interval: weekly }
